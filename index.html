<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>硬件研发项目表 本地系统 整理版</title>
<style>
:root {
  color-scheme: light;
  --bg: #eef3f6;
  --side: #0d1117;
  --side-2: #17202a;
  --panel: rgba(255, 255, 255, .92);
  --panel-soft: #eaf2f3;
  --line: rgba(26, 50, 64, .14);
  --line-strong: #8ca4b3;
  --text: #111827;
  --muted: #647482;
  --accent: #008c95;
  --accent-2: #6f8f20;
  --warn: #a16207;
  --danger: #c24132;
  --ok: #15803d;
  --shadow: 0 18px 42px rgba(19, 31, 42, .10);
  --glow: 0 0 0 1px rgba(0, 140, 149, .10), 0 16px 34px rgba(0, 55, 68, .08);
}
* { box-sizing: border-box; }
html {
  height: 100%;
  overflow: hidden;
}
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  font-size: 14px;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(rgba(0, 140, 149, .08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 140, 149, .08) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.82), rgba(0,0,0,.18));
}
button, input, select, textarea {
  font: inherit;
  color: inherit;
}
.app {
  display: grid;
  grid-template-columns: 228px minmax(0, 1fr);
  height: 100vh;
  overflow: hidden;
  position: relative;
  z-index: 1;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 16px 12px;
  background: var(--side);
  color: #f7fafc;
  border-right: 1px solid rgba(129, 230, 217, .18);
  box-shadow: 12px 0 34px rgba(8, 13, 20, .18);
}
.brand {
  padding: 5px 9px 16px;
  border-bottom: 1px solid rgba(129, 230, 217, .18);
  position: relative;
}
.brand-title {
  font-size: 17px;
  font-weight: 750;
  line-height: 1.3;
  color: #f8fbfc;
}
.brand-sub {
  margin-top: 5px;
  color: rgba(205, 237, 235, .66);
  font-size: 12px;
}
.nav {
  display: grid;
  gap: 5px;
  margin-top: 14px;
}
.nav button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 38px;
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: 6px;
  color: rgba(235, 248, 248, .78);
  background: rgba(255,255,255,.02);
  cursor: pointer;
  text-align: left;
}
.nav button.active {
  color: #fff;
  background: var(--side-2);
  border-color: rgba(129, 230, 217, .22);
  box-shadow: inset 3px 0 0 var(--accent);
}
.nav-count {
  color: rgba(186, 230, 226, .66);
  font-size: 12px;
}
.main {
  min-width: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  overflow: hidden;
}
.topbar {
  z-index: 10;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 14px;
  align-items: center;
  min-height: 72px;
  padding: 14px 18px;
  background: rgba(248, 251, 252, .90);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
  min-width: 0;
  box-shadow: 0 10px 26px rgba(25, 39, 58, .06);
}
.page-title {
  margin: 0;
  font-size: 20px;
  line-height: 1.2;
  font-weight: 780;
}
.page-meta {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  min-width: 0;
}
.toolbar input, .toolbar select {
  min-height: 34px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .94);
  padding: 0 10px;
  outline: none;
}
.toolbar input:focus, .toolbar select:focus,
.field-value input:focus, .field-value textarea:focus, .field-value select:focus,
.batchbar select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0, 140, 149, .13);
}
.toolbar input {
  width: min(330px, 36vw);
}
.toolbar button, .detail-actions button {
  min-height: 34px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .94);
  padding: 0 11px;
  cursor: pointer;
}
.toolbar button.primary, .detail-actions button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.toolbar button.danger, .detail-actions button.danger {
  background: #fff5f5;
  border-color: #f5b5b0;
  color: var(--danger);
}
.content {
  padding: 18px;
  min-width: 0;
  overflow-x: hidden;
  overflow-y: auto;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(130px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.summary-card {
  min-width: 0;
  padding: 13px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  box-shadow: var(--glow);
  backdrop-filter: blur(10px);
}
.summary-card:nth-child(2) {
  border-top-color: #22a6b3;
}
.summary-card:nth-child(3) {
  border-top-color: #6f8f20;
}
.summary-card:nth-child(4) {
  border-top-color: #d19a1d;
}
.summary-card:nth-child(5) {
  border-top-color: #64748b;
}
.summary-label {
  color: var(--muted);
  font-size: 12px;
}
.summary-value {
  margin-top: 7px;
  font-size: 25px;
  font-weight: 800;
  line-height: 1;
}
.summary-note {
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
  align-items: start;
  min-width: 0;
}
.detail {
  position: sticky;
  top: 0;
  display: grid;
  gap: 12px;
  max-height: calc(100vh - 126px);
  overflow: auto;
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  box-shadow: var(--glow);
  backdrop-filter: blur(10px);
}
.detail-title {
  margin: 0;
  font-size: 18px;
  line-height: 1.35;
}
.detail-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.field-grid {
  display: grid;
  grid-template-columns: 108px minmax(0, 1fr);
  gap: 8px 12px;
}
.field-label {
  color: var(--muted);
  font-size: 12px;
  padding-top: 3px;
}
.field-value {
  min-width: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.field-value input, .field-value textarea, .field-value select {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .96);
  padding: 7px 9px;
  outline: none;
}
.field-value textarea {
  min-height: 96px;
  resize: vertical;
}
.field-value textarea.auto-grow {
  min-height: 150px;
  overflow: hidden;
}
.issue-device-editor {
  display: grid;
  gap: 10px;
}
.upload-box {
  display: grid;
  gap: 8px;
}
.upload-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  border: 1px dashed var(--accent);
  border-radius: 6px;
  color: var(--accent);
  background: rgba(231, 250, 250, .76);
  cursor: pointer;
}
.upload-box input[type="file"] {
  display: none;
}
.thumb-item {
  position: relative;
}
.thumb-item [data-image-remove],
.thumb-item [data-child-image-remove] {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 20px;
  height: 20px;
  border: 0;
  border-radius: 50%;
  color: #fff;
  background: rgba(15, 23, 42, .72);
  cursor: pointer;
  line-height: 1;
}
.project-type-editor, .choice-editor {
  display: grid;
  gap: 8px;
}
.project-type-add, .choice-add, .file-upload-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
}
.project-type-add button, .choice-add button, .file-upload-row button {
  min-height: 34px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .94);
  padding: 0 11px;
  cursor: pointer;
}
.file-editor {
  display: grid;
  gap: 8px;
}
.file-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  border: 1px dashed var(--accent);
  border-radius: 6px;
  color: var(--accent);
  background: rgba(231, 250, 250, .76);
  cursor: pointer;
}
.file-trigger input[type="file"] {
  display: none;
}
.file-list {
  display: grid;
  gap: 6px;
}
.file-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 8px;
  align-items: center;
  min-height: 32px;
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(255, 255, 255, .78);
}
.file-preview-link {
  min-width: 0;
  border: 0;
  background: transparent;
  color: #075985;
  padding: 0;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
.file-preview-link:hover {
  text-decoration: underline;
}
.file-download-link {
  min-height: 26px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  color: #075985;
  background: #fff;
  padding: 4px 9px;
  text-decoration: none;
  white-space: nowrap;
}
.file-download-link:hover {
  background: #f0fcfd;
}
.file-item button:not(.file-preview-link) {
  min-height: 26px;
  border: 1px solid #f5b5b0;
  border-radius: 5px;
  color: var(--danger);
  background: #fff5f5;
  cursor: pointer;
}
.file-size {
  color: var(--muted);
  font-size: 12px;
}
.file-preview {
  display: grid;
  gap: 8px;
  margin-top: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(255, 255, 255, .94);
}
.file-preview-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: #0f172a;
  font-size: 13px;
  font-weight: 680;
}
.file-preview-close {
  width: 26px;
  height: 26px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
}
.file-preview iframe,
.file-preview img,
.file-preview pre {
  width: 100%;
  max-height: 62vh;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: #fff;
}
.file-preview iframe {
  min-height: 520px;
}
.file-preview img {
  object-fit: contain;
}
.file-preview pre {
  overflow: auto;
  padding: 10px;
  white-space: pre-wrap;
}
.file-preview-note {
  color: var(--muted);
  line-height: 1.5;
}
.person-editor {
  display: grid;
  gap: 8px;
}
.person-add {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
}
.person-add button {
  min-height: 34px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .94);
  padding: 0 11px;
  cursor: pointer;
}
.person-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.person-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 26px;
  padding: 2px 8px;
  border: 1px solid rgba(0, 140, 149, .26);
  border-radius: 999px;
  background: rgba(231, 250, 250, .88);
}
.person-chip button {
  width: 18px;
  height: 18px;
  border: 0;
  border-radius: 50%;
  color: var(--muted);
  background: rgba(255, 255, 255, .75);
  cursor: pointer;
  line-height: 1;
}
.contract-editor {
  display: grid;
  gap: 14px;
}
.contract-row {
  display: grid;
  grid-template-columns: 108px minmax(0, 1fr);
  gap: 8px 12px;
  align-items: start;
}
.contract-actions {
  display: flex;
  justify-content: flex-end;
}
.contract-actions button,
.child-actions button {
  min-height: 32px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .94);
  padding: 0 11px;
  cursor: pointer;
}
.child-list {
  display: grid;
  gap: 12px;
}
.child-card {
  display: grid;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  background: rgba(255, 255, 255, .68);
}
.child-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  font-weight: 720;
}
.child-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.child-field {
  display: grid;
  gap: 5px;
}
.child-field.full {
  grid-column: 1 / -1;
}
.child-timeline {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns:
    minmax(120px, 1fr)
    minmax(120px, 1fr)
    minmax(120px, 1fr)
    minmax(120px, 1fr);
  gap: 10px;
}
.child-field label {
  color: var(--muted);
  font-size: 12px;
}
.child-field input,
.child-field select,
.child-field textarea {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .96);
  padding: 7px 9px;
  outline: none;
}
.child-field textarea {
  min-height: 78px;
  resize: vertical;
}
.effect-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.paste-target {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 7px 12px;
  border: 1px dashed #19a5ad;
  border-radius: 6px;
  background: #f0fcfd;
  color: #087c84;
  font-size: 13px;
  cursor: text;
  outline: none;
}
.paste-target:focus {
  border-style: solid;
  box-shadow: 0 0 0 3px rgba(25, 165, 173, .16);
}
.child-actions button {
  color: var(--danger);
  border-color: #f5b5b0;
  background: #fff5f5;
}
.process-list {
  display: grid;
  gap: 10px;
}
.process-items {
  display: grid;
  gap: 10px;
}
.process-card {
  display: grid;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(234, 242, 243, .72);
}
.process-title {
  font-weight: 720;
}
.process-title-edit,
.process-actions {
  display: grid;
  grid-template-columns: minmax(180px, 1fr) auto;
  gap: 8px;
  align-items: center;
}
.process-title-edit input,
.process-actions input {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .96);
  padding: 7px 9px;
  outline: none;
}
.process-title-edit button {
  color: var(--danger);
  border-color: #f5b5b0;
  background: #fff5f5;
}
.process-fields {
  display: grid;
  grid-template-columns:
    minmax(92px, .9fr)
    minmax(86px, .8fr)
    minmax(120px, 1fr)
    minmax(120px, 1fr)
    minmax(120px, 1fr);
  gap: 8px;
}
.process-field {
  display: grid;
  gap: 5px;
}
.process-field.full {
  grid-column: 1 / -1;
}
.process-field label {
  color: var(--muted);
  font-size: 12px;
}
.process-field input,
.process-field select,
.process-field textarea {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: rgba(255, 255, 255, .96);
  padding: 7px 9px;
  outline: none;
}
.process-field textarea {
  min-height: 64px;
  resize: vertical;
}
.record-list {
  display: grid;
  gap: 10px;
  min-width: 0;
}
.record {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  gap: 8px;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid rgba(0, 140, 149, .36);
  box-shadow: 0 7px 22px rgba(25, 39, 58, .05);
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}
.record:hover, .record.active {
  border-color: var(--accent);
  box-shadow: var(--glow);
  transform: translateY(-1px);
}
.record.selected {
  background: rgba(231, 250, 250, .92);
  border-color: var(--accent);
}
.record-check {
  display: flex;
  align-items: flex-start;
  padding-top: 1px;
}
.record-check input {
  width: 16px;
  height: 16px;
  margin: 0;
  accent-color: var(--accent);
}
.record-body {
  display: grid;
  gap: 8px;
  min-width: 0;
}
.record-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  font-weight: 720;
  line-height: 1.35;
  color: #0f172a;
}
.record-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  color: var(--muted);
  font-size: 12px;
}
.record-desc {
  color: #334155;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.record-children {
  display: grid;
  gap: 8px;
}
.record-child {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  padding: 8px;
  border: 1px solid #d9e6ee;
  border-radius: 6px;
  background: #f8fcfd;
}
.record-child-info {
  min-width: 0;
}
.record-child-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
}
.record-child-main {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.record-child-name {
  font-weight: 680;
  color: #0f172a;
  overflow-wrap: anywhere;
}
.record-child-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
}
.record-child-owner,
.record-child-dates,
.record-child-more {
  color: var(--muted);
  font-size: 12px;
}
.record-child .thumbs {
  justify-content: flex-end;
}
.record-child .thumbs .thumb-preview {
  width: 62px;
  height: 46px;
}
.pill {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 1px 8px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 12px;
  font-weight: 680;
  white-space: nowrap;
}
.pill.done { color: #166534; background: #ddf7e7; border-color: #a7e7c0; }
.pill.pending { color: #92400e; background: #fff5cc; border-color: #f5d36c; }
.pill.progress { color: #075985; background: #d9f5f6; border-color: #88d9df; }
.thumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.thumbs:empty {
  display: none;
}
.thumbs a, .thumbs .thumb-preview {
  display: block;
  width: 74px;
  height: 54px;
  border: 1px solid var(--line);
  border-radius: 5px;
  overflow: hidden;
  background: #eef2f6;
  padding: 0;
  cursor: pointer;
}
.thumbs img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.image-preview {
  margin-top: 8px;
  padding: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .96);
  max-height: 70vh;
  overflow: auto;
}
.image-preview img {
  display: block;
  width: calc(var(--preview-scale, 1) * 100%);
  max-width: none;
  max-height: none;
  height: auto;
  object-fit: contain;
  cursor: zoom-in;
  transform-origin: top left;
  user-select: none;
}
.empty-state {
  padding: 46px 18px;
  color: var(--muted);
  text-align: center;
  background: var(--panel);
  border: 1px solid var(--line);
}
.batchbar {
  position: sticky;
  top: 0;
  z-index: 4;

function loadStoredData() {
  try {
    const raw = JSON.parse(localStorage.getItem(editKey) || '{}');
    if (raw.edits || raw.additions || raw.deleted) {
      return {
        edits: raw.edits || {},
        additions: raw.additions || {},
        deleted: raw.deleted || {}
      };
    }
    return { edits: raw || {}, additions: {}, deleted: {} };
  } catch (error) {
    return { edits: {}, additions: {}, deleted: {} };
  }
}

function saveEdits() {
  try {
    const draftIds = new Set(Object.values(additions).flatMap(items => (items || []).filter(item => item.draft).map(item => item.id)));
    const savedEdits = Object.fromEntries(Object.entries(edits).filter(([id]) => !draftIds.has(id)));
    const savedAdditions = Object.fromEntries(Object.entries(additions).map(([moduleId, items]) => [
      moduleId,
      (items || []).filter(item => !item.draft)
    ]));
    localStorage.setItem(editKey, JSON.stringify({ edits: savedEdits, additions: savedAdditions, deleted }));
    return true;
  } catch (error) {
    console.error('保存失败', error);
    const quota = /quota|storage/i.test(error?.name || error?.message || '');
    alert(quota
      ? '保存失败：浏览器本地存储空间不足。请先删除一些已上传的大图片或大文件，或改用较小的图片后再保存。'
      : '保存失败：浏览器阻止了本地存储，请检查浏览器权限或换一个浏览器打开。');
    return false;
  }
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, '&#96;');
}

function findSheet(name) {
  return workbook.sheets.find(sheet => sheet.name === name);
}

function cellMap(row) {
  const out = {};
  row.forEach(cell => {
    out[cell.col] = cell;
  });
  return out;
}

function fieldValue(byCol, cols) {
  const colList = Array.isArray(cols) ? cols : [cols];
  return colList.map(col => (byCol[col]?.text || '').trim()).filter(Boolean).join('\n');
}

function fieldImages(byCol, cols) {
  const colList = Array.isArray(cols) ? cols : [cols];
  return colList.flatMap(col => byCol[col]?.images || []);
}

function stripCompanyFromTitle(value) {
  const text = String(value || '').trim();
  const normalized = text.replace(/\s*\+\s*/g, '+');
  const match = normalized.match(/^(.+公司)\+(.+)$/);
  if (!match) return text;
  const number = match[2].match(/(?:YYH-[A-Z0-9-]+|\d{12,})/i);
  return number ? number[0] : text;
}

function normalizeStatus(value) {
  const text = String(value || '').trim();
  if (STATUS_OPTIONS.includes(text)) return text;
  if (/已发货|已交付/.test(text)) return '已发货';
  if (/已完成|已处理|已结束/.test(text)) return '已完成';
  if (/制作中|钣金中|进行|处理中/.test(text)) return '进行中';
  if (/未开始|待|未|取消|拒绝|暂停/.test(text) || !text) return '未开始';
  return '未开始';
}

function makeRecord(moduleId, config, id, rowNumber, values, fields, local = false) {
  const override = edits[id] || {};
  fields.forEach(field => {
    if (Object.prototype.hasOwnProperty.call(override, field.key)) {
      field.value = override[field.key];
      values[field.key] = override[field.key];
    }
    if (moduleId === 'projects' && (field.key === 'title' || field.key === 'parent')) {
      field.value = stripCompanyFromTitle(field.value);
      values[field.key] = field.value;
    }
    if (field.key === 'status' && config.normalizeStatus !== false) {
      field.value = normalizeStatus(field.value);
      values[field.key] = field.value;
    }
    const imageKey = `${field.key}Images`;
    if (Array.isArray(override[imageKey])) {
      field.images = override[imageKey];
    }
    const fileKey = `${field.key}Files`;
    if (Array.isArray(override[fileKey])) {
      field.files = override[fileKey];
    }
    field.values = values;
  });
  Object.entries(override).forEach(([key, value]) => {
    if (key !== 'children') {
      values[key] = value;
    }
  });
  const extraImages = Object.entries(values)
    .filter(([key, value]) => /Images$/.test(key) && Array.isArray(value))
    .flatMap(([, value]) => value);
  const images = [...new Set(fields.flatMap(field => field.images).concat(extraImages))];
  const fileNames = fields.flatMap(field => field.files || []).map(file => file.name || '').filter(Boolean);
  const children = Array.isArray(override.children) ? override.children : (Array.isArray(values.children) ? values.children : []);
  children.forEach(child => {
    child.status = normalizeStatus(child.status);
    child.processes = normalizeProcesses(child.processes);
  });
  values.children = children;
  const childSearch = children.flatMap(child => [
    child.deviceName, child.docsText, child.owner, child.status,
    child.plannedStart, child.plannedEnd, child.actualEnd, child.remarks,
    ...(child.processes || []).flatMap(process => [
      process.name, process.status, process.plannedStart,
      process.plannedEnd, process.actualEnd, process.remarks
    ]),
    ...(child.effectImages || []).map((_, index) => `效果图${index + 1}`),
    ...(child.docsFiles || []).map(file => file.name || '')
  ]).filter(Boolean).join(' ');
  const title = values[config.title] || values.title || values.name || values.device || values.customer || values.person || (local ? (moduleId === 'issues' ? '新问题' : '新合同') : `第 ${rowNumber} 行`);
  return {
    id, moduleId, sheetName: config.sheet, rowNumber, title, values, fields, images, children, local,
    status: values.status || values.progress || values.result || values.delay || '',
    search: `${title} ${Object.values(values).filter(value => !Array.isArray(value)).join(' ')} ${fileNames.join(' ')} ${childSearch}`.toLowerCase()
  };
}

function buildRecords() {
  const output = {};
  Object.entries(configs).forEach(([moduleId, config]) => {
    const sheet = findSheet(config.sheet);
    output[moduleId] = [];
    if (!sheet) return;
    sheet.rows.slice(1).forEach(row => {
      const byCol = cellMap(row);
      const values = {};
      const fields = config.fields.map(([key, label, cols]) => {
        const value = fieldValue(byCol, cols);
        const images = fieldImages(byCol, cols);
        values[key] = value;
        return { key, label, value, images, files: [], moduleId, values };
      });
      const hasContent = fields.some(field => field.value || field.images.length);
      if (!hasContent) return;
      const rowNumber = row[0]?.row || output[moduleId].length + 2;
      const id = `${moduleId}:${rowNumber}`;
      if ((deleted[moduleId] || []).includes(id)) return;
      output[moduleId].push(makeRecord(moduleId, config, id, rowNumber, values, fields));
    });
    (additions[moduleId] || []).forEach((item, index) => {
      const values = { ...(item.values || {}) };
      const fields = config.fields.map(([key, label]) => ({
        key,
        label,
        value: values[key] || '',
        images: [],
        files: [],
        moduleId,
        values
      }));
      output[moduleId].unshift(makeRecord(moduleId, config, item.id, `新增${index + 1}`, values, fields, true));
    });
  });
  records = output;
}

function statusClass(text) {
  const status = normalizeStatus(text);
  if (status === '已完成' || status === '已发货') return 'done';
  if (status === '未开始') return 'pending';
  if (status === '进行中') return 'progress';
  return 'progress';
}

function compactDate(value) {

}

function recordMeta(item) {
  const labels = { pm: '产品经理', sales: '销售经理', owner: '负责人', source: '反馈来源', createdAt: '创建时间', creator: '创建人', onlineAt: '上线时间' };

    return `<span>${escapeHtml(labels[key] || key)}：${escapeHtml(value ? compactDate(value) : '-')}</span>`;
  }).join('');
}

function thumbs(images, limit = 4) {
  return (images || []).slice(0, limit).map((src, index) =>
    `<button type="button" class="thumb-preview" data-preview-image="${escapeAttr(src)}" aria-label="预览图片${index + 1}"><img src="${escapeAttr(src)}" alt=""></button>`
  ).join('');
}

function childSummary(item, compact = false) {
  const children = (item.children || []).filter(child =>
    child.deviceName || child.owner || (child.effectImages || []).length
  );
  if (!children.length) return '';
  const limit = compact ? 1 : 3;
  return `<div class="record-children">
    ${children.slice(0, limit).map((child, index) => `<div class="record-child">
      <div class="record-child-info">
        <div class="record-child-top">
          <div class="record-child-main">
            <span class="record-child-name">${escapeHtml(child.deviceName || `子对象 ${index + 1}`)}</span>
            <div class="record-child-meta">
              <span class="record-child-dates">计划开始：${escapeHtml(child.plannedStart || '-')}</span>
              <span class="record-child-dates">计划结束：${escapeHtml(child.plannedEnd || '-')}</span>
              <span class="record-child-owner">负责人：${escapeHtml(child.owner || '-')}</span>
            </div>
          </div>
          ${(child.effectImages || []).length ? `<div class="thumbs">${thumbs(child.effectImages, compact ? 1 : 3)}</div>` : ''}
        </div>
      </div>
    </div>`).join('')}
    ${children.length > limit ? `<div class="record-child-more">还有 ${children.length - limit} 个子对象</div>` : ''}
  </div>`;
}

function recordCard(item, compact = false) {
  const desc = item.values.desc || item.values.remarks || item.values.parent || '';
  const checked = state.selectedIds.includes(item.id);
  return `<article class="record ${state.selected === item.id ? 'active' : ''} ${checked ? 'selected' : ''}" data-id="${escapeHtml(item.id)}">
    <label class="record-check" title="选择记录"><input type="checkbox" data-select-id="${escapeHtml(item.id)}" ${checked ? 'checked' : ''}></label>
    <div class="record-body">
      <div class="record-title">
        <span>${escapeHtml(item.title)}</span>
        ${item.status ? `<span class="pill ${statusClass(item.status)}">${escapeHtml(item.status)}</span>` : ''}
      </div>
      <div class="record-meta">${recordMeta(item)}</div>
      ${!compact && desc ? `<div class="record-desc">${escapeHtml(desc.length > 170 ? desc.slice(0, 170) + '...' : desc)}</div>` : ''}
      ${childSummary(item, compact)}
      <div class="thumbs">${thumbs(item.images, compact ? 2 : 4)}</div>
    </div>
  </article>`;
}

function filteredRecords(moduleId) {
  const term = state.query.trim().toLowerCase();
  const status = state.status.trim();
  return (records[moduleId] || []).filter(item => {
    const passText = !term || item.search.includes(term);
    const passStatus = state.statusQuick ? statusQuickMatch(item.status, state.statusQuick) : (!status || item.status === status);
    return passText && passStatus;
  });
}

function moduleStatusOptions(moduleId) {
  if (moduleId === 'projects') return STATUS_OPTIONS;
  return [...new Set((records[moduleId] || []).map(item => item.status).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
}

function statusQuickMatch(status, quick) {
  const value = normalizeStatus(status);
  if (quick === 'pending') return value === '未开始';
  if (quick === 'progress') return value === '进行中';
  if (quick === 'done') return value === '已完成';
  if (quick === 'shipped') return value === '已发货';
  return true;
}

function renderProjectSummary() {
  const items = records.projects || [];
  const total = items.length;
  const pending = items.filter(item => item.status === '未开始').length;
  const making = items.filter(item => item.status === '进行中').length;
  const finished = items.filter(item => item.status === '已完成').length;
  const shipped = items.filter(item => item.status === '已发货').length;
  const visible = filteredRecords(state.module).length;
  return `<div class="summary-grid">
    ${summaryCard('项目总数', total, `当前筛选 ${visible} 条`, 'all')}
    ${summaryCard('未开始', pending, '未开始项目', 'pending')}
    ${summaryCard('进行中', making, '正在推进的项目', 'progress')}
    ${summaryCard('已完成', finished, '已完成项目', 'done')}
    ${summaryCard('已发货', shipped, '已发货项目', 'shipped')}
  </div>`;
}

function renderIssueSummary() {
  const items = records.issues || [];
  const total = items.length;
  const pending = items.filter(item => /待|未/.test(item.status || '')).length;
  const progress = items.filter(item => /处理中|进行中/.test(item.status || '')).length;
  const done = items.filter(item => /已/.test(item.status || '')).length;
  const visible = filteredRecords(state.module).length;
  return `<div class="summary-grid">
    ${summaryCard('问题总数', total, `当前筛选 ${visible} 条`, 'all')}
    ${summaryCard('待处理', pending, '待跟进问题', 'pending')}
    ${summaryCard('处理中', progress, '正在处理问题', 'progress')}
    ${summaryCard('已处理', done, '已处理问题', 'done')}
  </div>`;
}

function summaryCard(label, value, note, quick = '') {
  const active = quick && (quick === 'all' ? (!state.status && !state.statusQuick) : state.statusQuick === quick);
  return `<section class="summary-card ${active ? 'active' : ''}" ${quick ? `data-summary-filter="${escapeAttr(quick)}" role="button" tabindex="0"` : ''}>
    <div class="summary-label">${escapeHtml(label)}</div>
    <div class="summary-value">${escapeHtml(value)}</div>
    <div class="summary-note">${escapeHtml(note)}</div>
  </section>`;
}

function renderList(moduleId) {
  const list = filteredRecords(moduleId);
  state.selectedIds = state.selectedIds.filter(id => list.some(item => item.id === id));
  if (state.selected && !list.some(item => item.id === state.selected)) {
    state.selected = '';
    state.editing = '';
  }
  const detail = state.selected ? findRecord(state.selected) : null;
  const summary = moduleId === 'projects' ? renderProjectSummary() : renderIssueSummary();
  return `${summary}<div class="layout">
    <div>
      ${renderBatchBar(list)}
      <div class="record-list">${list.length ? list.map(item => recordCard(item)).join('') : '<div class="empty-state">没有匹配记录</div>'}</div>
    </div>
  </div>${detail ? renderDetail(detail, state.editing === detail?.id) : ''}`;
}

function renderBatchBar(list) {
  const selectedCount = state.selectedIds.length;
  const allVisibleSelected = list.length > 0 && list.every(item => state.selectedIds.includes(item.id));
  const statusValues = moduleStatusOptions(state.module);
  return `<div class="batchbar">
    <div class="batch-left">
      <label><input type="checkbox" id="selectAllVisible" ${allVisibleSelected ? 'checked' : ''} ${list.length ? '' : 'disabled'}>全选当前列表</label>
      <span>已选 ${selectedCount} 项</span>
    </div>
    <div class="batch-actions">
      <select id="batchStatusSelect" ${selectedCount ? '' : 'disabled'}>
        <option value="">批量改状态</option>
        ${statusValues.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('')}
      </select>
      <button type="button" id="batchStatusBtn" ${selectedCount ? '' : 'disabled'}>应用</button>
      <button type="button" class="danger" id="batchDeleteBtn" ${selectedCount ? '' : 'disabled'}>删除所选</button>
    </div>
  </div>`;
}

function findRecord(id) {
  return Object.values(records).flat().find(item => item.id === id);
}

function splitPeople(value) {
  return String(value || '').split(/[、,，;；\n]/).map(item => item.trim()).filter(Boolean);
}

function joinPeople(items) {
  return [...new Set(items.map(item => item.trim()).filter(Boolean))].join('、');
}

function optionList(fieldKey) {
  const values = new Set();
  Object.values(records).flat().forEach(item => {
    const raw = item.values?.[fieldKey];
    const items = fieldKey === 'owner' || fieldKey === 'pm' ? splitPeople(raw) : [String(raw || '').trim()].filter(Boolean);
    items.forEach(value => values.add(value));
  });
  return [...values].sort((a, b) => a.localeCompare(b, 'zh-CN'));
}

function imageName(src, index) {
  if (/^data:image\//.test(src)) return `上传图片${index + 1}`;
  return String(src || '').split('/').pop() || `图片${index + 1}`;
}

function formatBytes(bytes) {
  const value = Number(bytes || 0);
  if (!value) return '';
  if (value < 1024) return `${value} B`;
  if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
  return `${(value / 1024 / 1024).toFixed(1)} MB`;
}

function renderFilePreviewButton(file, index) {
  const name = file.name || `文件${index + 1}`;
  return `<button type="button" class="file-preview-link" data-preview-file-url="${escapeAttr(file.dataUrl || '')}" data-preview-file-name="${escapeAttr(name)}" data-preview-file-type="${escapeAttr(file.type || '')}">${escapeHtml(name)}</button>`;
}

function renderFileDownloadLink(file, index) {
  const name = file.name || `文件${index + 1}`;
  return `<a class="file-download-link" href="${escapeAttr(file.dataUrl || '#')}" download="${escapeAttr(name)}">下载</a>`;
}

function imageEditorMarkup(key, label, names = '', images = [], placeholder = '图片说明或图片名') {
  return `<div class="upload-box" data-image-field="${escapeHtml(key)}">
    <input type="hidden" data-edit-images-key="${escapeHtml(key)}Images" value="${escapeAttr(JSON.stringify(images))}">
    <div class="effect-tools">
      <label class="upload-trigger">${escapeHtml(label)}<input type="file" accept="image/*" multiple data-image-upload></label>
      <div class="paste-target" data-image-paste tabindex="0">点击此处后可直接粘贴图片</div>
    </div>
    <textarea data-edit-key="${escapeHtml(key)}" data-image-names placeholder="${escapeAttr(placeholder)}">${escapeHtml(names)}</textarea>
    <div class="thumbs">
      ${images.map((src, index) => `<span class="thumb-item" data-image-index="${index}"><button type="button" class="thumb-preview" data-preview-image="${escapeAttr(src)}" aria-label="预览${escapeAttr(imageName(src, index))}"><img src="${escapeAttr(src)}" alt="${escapeAttr(imageName(src, index))}"></button><button type="button" data-image-remove="${index}" aria-label="移除图片">×</button></span>`).join('')}
    </div>
  </div>`;
}

function choiceDefaults(fieldKey) {
  if (fieldKey === 'projectType') return ['定制', '半定制', '标品生产', '研发'];
  if (fieldKey === 'status') return STATUS_OPTIONS;
  return [];
}

function choiceOptions(fieldKey, value = '', moduleId = state.module) {
  if (fieldKey === 'status') return moduleId === 'projects'
    ? STATUS_OPTIONS
    : [...new Set(ISSUE_STATUS_OPTIONS.concat(moduleStatusOptions(moduleId), value ? [value] : []).filter(Boolean))];
  return [...new Set(choiceDefaults(fieldKey).concat(optionList(fieldKey), value ? [value] : []).filter(Boolean))];
}

function renderChoiceEditor(field, placeholder) {
  const value = field.key === 'status' && field.moduleId === 'projects' ? normalizeStatus(field.value) : (field.value || '');
  const options = choiceOptions(field.key, value, field.moduleId);
  return `<div class="choice-editor" data-choice-field="${escapeHtml(field.key)}">
    <input type="hidden" data-edit-key="${escapeHtml(field.key)}" value="${escapeAttr(value)}">
    <select data-choice-select>
      <option value=""></option>
      ${options.map(option => `<option value="${escapeAttr(option)}" ${option === value ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}
    </select>
    <div class="choice-add">
      <input data-choice-custom placeholder="${escapeAttr(placeholder)}">
      <button type="button" data-choice-add>添加</button>
    </div>
  </div>`;
}

function renderProjectTypeEditor(field) {
  return renderChoiceEditor(field, '自定义项目类型');
}

function renderStatusEditor(field) {
  return renderChoiceEditor(field, '自定义状态');
}

function renderPeopleEditor(field) {
  const selected = splitPeople(field.value);
  const options = optionList(field.key).filter(name => !selected.includes(name));
  return `<div class="person-editor" data-person-field="${escapeHtml(field.key)}">
    <input type="hidden" data-edit-key="${escapeHtml(field.key)}" value="${escapeAttr(joinPeople(selected))}">
    <div class="person-add">
      <select data-person-select>
        <option value="">选择人员</option>
        ${options.map(name => `<option value="${escapeAttr(name)}">${escapeHtml(name)}</option>`).join('')}
      </select>
      <button type="button" data-person-add>增加</button>
    </div>
    <input data-person-custom placeholder="自定义人员">
    <div class="person-list">
      ${selected.map(name => `<span class="person-chip" data-person-name="${escapeAttr(name)}">${escapeHtml(name)}<button type="button" data-person-remove="${escapeAttr(name)}" aria-label="移除${escapeAttr(name)}">×</button></span>`).join('')}
    </div>
  </div>`;
}

function renderEffectEditor(field) {
  const names = field.value || '';
  const images = field.images || [];
  return imageEditorMarkup(field.key, '点击上传图片', names, images, '效果图说明或图片名');
}

function renderFileList(files = [], removable = false) {
  if (!files.length) return '';
  return `<div class="file-list">
    ${files.map((file, index) => `<div class="file-item">
      ${renderFilePreviewButton(file, index)}
      ${renderFileDownloadLink(file, index)}
      ${removable ? `<button type="button" data-file-remove="${index}">删除</button>` : `<span class="file-size">${escapeHtml(formatBytes(file.size))}</span>`}
    </div>`).join('')}
  </div>`;
}

function renderDocsEditor(field) {
  const names = field.value || '';
  const files = field.files || [];
  return `<div class="file-editor" data-file-field="${escapeHtml(field.key)}">
    <input type="hidden" data-edit-files-key="${escapeHtml(field.key)}Files" value="${escapeAttr(JSON.stringify(files))}">
    <label class="file-trigger">点击上传文件<input type="file" multiple data-file-upload></label>
    <textarea data-edit-key="${escapeHtml(field.key)}" data-file-names placeholder="需求文档说明或文件名">${escapeHtml(names)}</textarea>
    ${renderFileList(files, true)}
  </div>`;
}

function renderAttachmentsEditor(field) {
  const names = field.value || '';
  const images = field.images || [];
  const files = field.files || [];
  return `<div class="upload-box file-editor" data-image-field="${escapeHtml(field.key)}" data-file-field="${escapeHtml(field.key)}">
    <input type="hidden" data-edit-images-key="${escapeHtml(field.key)}Images" value="${escapeAttr(JSON.stringify(images))}">
    <input type="hidden" data-edit-files-key="${escapeHtml(field.key)}Files" value="${escapeAttr(JSON.stringify(files))}">
    <div class="effect-tools">
      <label class="upload-trigger">点击上传图片<input type="file" accept="image/*" multiple data-image-upload></label>
      <label class="file-trigger">点击上传本地文件<input type="file" multiple data-file-upload></label>
      <div class="paste-target" data-image-paste tabindex="0">点击此处后可直接粘贴图片</div>
    </div>
    <textarea data-edit-key="${escapeHtml(field.key)}" data-image-names data-file-names placeholder="图片或附件说明">${escapeHtml(names)}</textarea>
    <div class="thumbs">
      ${images.map((src, index) => `<span class="thumb-item" data-image-index="${index}"><button type="button" class="thumb-preview" data-preview-image="${escapeAttr(src)}" aria-label="预览${escapeAttr(imageName(src, index))}"><img src="${escapeAttr(src)}" alt="${escapeAttr(imageName(src, index))}"></button><button type="button" data-image-remove="${index}" aria-label="移除图片">×</button></span>`).join('')}
    </div>
    ${renderFileList(files, true)}
  </div>`;
}

function renderIssueDeviceEditor(field) {
  const effectKey = 'effect';
  const effectNames = field.values?.[effectKey] || '';
  const effectImages = field.values?.[`${effectKey}Images`] || [];
  return `<div class="issue-device-editor">
    <input data-edit-key="${escapeHtml(field.key)}" value="${escapeAttr(field.value || '')}">
    ${imageEditorMarkup(effectKey, '点击上传效果图', effectNames, effectImages, '效果图说明或图片名')}
  </div>`;
}

function renderFieldControl(field, editing) {
  const value = field.value || '';
  if (!editing) {
    if (field.key === 'docs') return `<div>${escapeHtml(value || '-')}</div>${renderFileList(field.files || [])}`;
    if (field.key === 'attachments') return `<div>${escapeHtml(value || '-')}</div>${renderFileList(field.files || [])}`;
    if (field.moduleId === 'issues' && field.key === 'device') {
      return `<div>${escapeHtml(value || '-')}</div><div class="thumbs">${thumbs(field.values?.effectImages || [], 12)}</div>`;
    }
    return `<div>${escapeHtml(value || '-')}</div>`;
  }
  if (field.moduleId === 'issues' && field.key === 'device') return renderIssueDeviceEditor(field);
  if (field.moduleId === 'issues' && field.key === 'desc') return `<textarea class="auto-grow" data-auto-grow data-edit-key="${escapeHtml(field.key)}">${escapeHtml(value)}</textarea>`;
  if (field.key === 'projectType') return renderProjectTypeEditor(field);
  if (field.key === 'status') return renderStatusEditor(field);
  if (field.key === 'effect') return renderEffectEditor(field);
  if (field.key === 'docs') return renderDocsEditor(field);
  if (field.key === 'attachments') return renderAttachmentsEditor(field);
  if (field.key === 'owner' || field.key === 'pm') return renderPeopleEditor(field);
  if (field.images.length) return `<div>${escapeHtml(value || '-')}</div>`;
  return value.length > 42 || /\n/.test(value)
    ? `<textarea data-edit-key="${escapeHtml(field.key)}">${escapeHtml(value)}</textarea>`
    : `<input data-edit-key="${escapeHtml(field.key)}" value="${escapeAttr(value)}">`;
}

function updatePersonEditor(editor, names) {
  const uniqueNames = [...new Set(names.filter(Boolean))];
  const key = editor.dataset.personField;
  const hidden = editor.querySelector('[data-edit-key]');
  const list = editor.querySelector('.person-list');
  const select = editor.querySelector('[data-person-select]');
  hidden.value = joinPeople(uniqueNames);
  list.innerHTML = uniqueNames.map(name => `<span class="person-chip" data-person-name="${escapeAttr(name)}">${escapeHtml(name)}<button type="button" data-person-remove="${escapeAttr(name)}" aria-label="移除${escapeAttr(name)}">×</button></span>`).join('');
  const options = optionList(key).filter(name => !uniqueNames.includes(name));
  select.innerHTML = `<option value="">选择人员</option>${options.map(name => `<option value="${escapeAttr(name)}">${escapeHtml(name)}</option>`).join('')}`;
}

function readImageEditor(editor) {
  const hidden = editor.querySelector('[data-edit-images-key]');
  try {
    return JSON.parse(hidden.value || '[]');
  } catch (error) {
    return [];
  }
}

function updateImageEditor(editor, images, names) {
  editor.querySelector('[data-edit-images-key]').value = JSON.stringify(images);
  editor.querySelector('[data-image-names]').value = names;
  const thumbsBox = editor.querySelector('.thumbs');
  thumbsBox.innerHTML = images.map((src, index) => `<span class="thumb-item" data-image-index="${index}"><button type="button" class="thumb-preview" data-preview-image="${escapeAttr(src)}" aria-label="预览${escapeAttr(imageName(src, index))}"><img src="${escapeAttr(src)}" alt="${escapeAttr(imageName(src, index))}"></button><button type="button" data-image-remove="${index}" aria-label="移除图片">×</button></span>`).join('');
}

function updateChoiceEditor(editor, value) {
  const hidden = editor.querySelector('[data-edit-key]');
  const select = editor.querySelector('[data-choice-select]');
  const fieldKey = editor.dataset.choiceField;
  const options = choiceOptions(fieldKey, value);
  hidden.value = value;
  select.innerHTML = `<option value=""></option>${options.map(option => `<option value="${escapeAttr(option)}" ${option === value ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}`;
}

function readFileEditor(editor) {
  const hidden = editor.querySelector('[data-edit-files-key]');
  try {
    return JSON.parse(hidden.value || '[]');
  } catch (error) {
    return [];
  }
}

function updateFileEditor(editor, files, names) {
  editor.querySelector('[data-edit-files-key]').value = JSON.stringify(files);
  editor.querySelector('[data-file-names]').value = names;
  const list = editor.querySelector('.file-list');
  const nextList = renderFileList(files, true);
  if (list) {
    if (nextList) {
      list.outerHTML = nextList;
    } else {
      list.remove();
    }
    return;
  }
  if (nextList) editor.insertAdjacentHTML('beforeend', nextList);
}

function autoGrowTextarea(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = `${textarea.scrollHeight}px`;
}

function autoGrowTextareas(root = document) {
  root.querySelectorAll('textarea[data-auto-grow]').forEach(autoGrowTextarea);
}

async function pasteImagesIntoEditor(event, editor) {
  const files = [...(event.clipboardData?.items || [])]
    .filter(item => item.type.startsWith('image/'))
    .map(item => item.getAsFile())
    .filter(Boolean);
  if (!editor || !files.length) return false;
  event.preventDefault();
  const uploaded = await Promise.all(files.map(fileToDataUrl));
  const images = readImageEditor(editor).concat(uploaded);
  const names = splitPeople(editor.querySelector('[data-edit-key]').value).concat(files.map(file => file.name || `粘贴图片${Date.now()}`));
  updateImageEditor(editor, images, joinPeople(names));
  return true;
}

function emptyChildObject() {
  return {
    id: `child:${Date.now()}:${Math.random().toString(16).slice(2)}`,
    deviceName: '',
    effectText: '',
    effectImages: [],
    docsText: '',
    docsFiles: [],
    owner: '',
    status: '未开始',
    plannedStart: '',
    plannedEnd: '',
    actualEnd: '',
    remarks: '',
    processes: defaultProcesses()
  };
}

function childStatusOptions(value = '') {
  return STATUS_OPTIONS;
}

function processTemplates() {
  return [
    { key: 'electrical', name: '1、电气选型、原型实验、程序编写、接线图纸' },
    { key: 'mechanical', name: '2、机械图' },
    { key: 'sheetMetal', name: '3、钣金生产' },
    { key: 'assembly', name: '4、装配' }
  ];
}

function defaultProcesses() {
  return processTemplates().map(item => ({
    ...item,
    owner: '',
    status: '未开始',
    plannedStart: '',
    plannedEnd: '',
    actualEnd: '',
    remarks: ''
  }));
}

function emptyProcess(name = '') {
  return {
    key: `custom:${Date.now()}:${Math.random().toString(16).slice(2)}`,
    name: name || '自定义工序',
    owner: '',
    status: '未开始',
    plannedStart: '',
    plannedEnd: '',
    actualEnd: '',
    remarks: ''
  };
}

function normalizeProcesses(processes) {
  if (!Array.isArray(processes)) return defaultProcesses();
  return processes.map((process, index) => {
    const template = processTemplates().find(item => item.key === process.key || item.name === process.name);
    return {
      key: process.key || template?.key || `custom:${index}:${process.name || 'process'}`,
      name: process.name || template?.name || `工序 ${index + 1}`,
      owner: process.owner || '',
      status: normalizeStatus(process.status),
      plannedStart: process.plannedStart || '',
      plannedEnd: process.plannedEnd || '',
      actualEnd: process.actualEnd || '',
      remarks: process.remarks || ''
    };
  }).filter(process => process.name);
}

function renderChildUploadList(items = [], type, removable = true) {
  if (!items.length) return '';
  if (type === 'image') {

function collectChildren(detail) {
  return [...detail.querySelectorAll('.child-card[data-child-index]')].map(card => {
    const child = emptyChildObject();
    card.querySelectorAll('[data-child-key]').forEach(input => {
      child[input.dataset.childKey] = input.value;
    });
    child.status = normalizeStatus(child.status);
    child.effectImages = readJsonInput(card.querySelector('[data-child-images]'));
    child.docsFiles = readJsonInput(card.querySelector('[data-child-files]'));
    child.processes = collectProcesses(card);
    return child;
  });
}

function collectProcesses(card) {
  return [...card.querySelectorAll('.process-card[data-process-index]')].map(processCard => {
    const process = {};
    processCard.querySelectorAll('[data-process-key]').forEach(input => {
      process[input.dataset.processKey] = input.value;
    });
    process.status = normalizeStatus(process.status);
    return process;
  });
}

function readJsonInput(input) {
  try {
    return JSON.parse(input?.value || '[]');
  } catch (error) {
    return [];
  }
}

function updateChildImages(card, images) {
  card.querySelector('[data-child-images]').value = JSON.stringify(images);
  const field = card.querySelector('[data-child-image-upload]')?.closest('.child-field');
  const existing = field?.querySelector('.thumbs');
  const next = renderChildUploadList(images, 'image');
  if (existing) {
    if (next) existing.outerHTML = next;
    else existing.remove();
  } else if (next) {
    field.insertAdjacentHTML('beforeend', next);
  }
}

function updateChildFiles(card, files) {
  card.querySelector('[data-child-files]').value = JSON.stringify(files);
  const field = card.querySelector('[data-child-file-upload]')?.closest('.child-field');
  const existing = field?.querySelector('.file-list');
  const next = renderChildUploadList(files, 'file');
  if (existing) {
    if (next) existing.outerHTML = next;
    else existing.remove();
  } else if (next) {
    field.insertAdjacentHTML('beforeend', next);
  }
}

function toggleImagePreview(button) {
  const host = button.closest('.field-value') || button.closest('.record-body') || button.parentElement;
  const existing = host.querySelector('.image-preview');
  if (existing && existing.dataset.previewImage === button.dataset.previewImage) {
    existing.remove();
    return;
  }
  if (existing) existing.remove();
  const preview = document.createElement('div');
  preview.className = 'image-preview';
  preview.dataset.previewImage = button.dataset.previewImage;
  preview.innerHTML = `<img src="${escapeAttr(button.dataset.previewImage)}" alt="预览图" data-preview-scale="1" style="--preview-scale: 1;">`;
  const thumbsBox = button.closest('.thumbs');
  (thumbsBox || button).insertAdjacentElement('afterend', preview);
}

function previewFile(button) {
  const dataUrl = button.dataset.previewFileUrl || '';
  const name = button.dataset.previewFileName || '文件';
  const type = button.dataset.previewFileType || '';
  const ext = name.split('.').pop().toLowerCase();
  const host = button.closest('.child-field') || button.closest('.field-value') || button.closest('.file-list')?.parentElement || button.parentElement;
  if (!host || !dataUrl) return;
  host.querySelector('.file-preview')?.remove();
  const preview = document.createElement('div');
  preview.className = 'file-preview';
  const canImage = type.startsWith('image/') || ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'svg'].includes(ext);
  const canPdf = type === 'application/pdf' || ext === 'pdf';
  const canText = type.startsWith('text/') || ['txt', 'csv', 'json', 'md', 'html', 'css', 'js', 'xml'].includes(ext);
  let body = '';
  if (canImage) {
    body = `<img src="${escapeAttr(dataUrl)}" alt="${escapeAttr(name)}">`;
  } else if (canPdf) {
    body = `<iframe src="${escapeAttr(dataUrl)}" title="${escapeAttr(name)}"></iframe>`;
  } else if (canText) {
    body = '<pre>正在读取...</pre>';
  } else {
    body = '<div class="file-preview-note">当前文件格式无法在本地页面内直接预览。Word、Excel、PPT 等 Office 文件需要浏览器插件或转换为 PDF 后才能稳定在线查看。</div>';
  }
  preview.innerHTML = `<div class="file-preview-head"><span>${escapeHtml(name)}</span><button type="button" class="file-preview-close" data-file-preview-close aria-label="关闭预览">×</button></div>${body}`;
  button.closest('.file-list')?.insertAdjacentElement('afterend', preview);
  if (canText) {
    fetch(dataUrl).then(response => response.text()).then(content => {
      const pre = preview.querySelector('pre');
      if (pre) pre.textContent = content;
    }).catch(() => {
      const pre = preview.querySelector('pre');
      if (pre) pre.textContent = '文本预览失败。';
    });
  }
}

function zoomPreviewImage(event) {
  const image = event.target.closest('.image-preview img');
  if (!image) return;
  event.preventDefault();
  event.stopPropagation();
  const current = Number(image.dataset.previewScale || '1');
  const direction = event.deltaY < 0 ? 1 : -1;
  const next = Math.min(6, Math.max(0.5, current + direction * 0.2));
  image.dataset.previewScale = next.toFixed(2);
  image.style.setProperty('--preview-scale', next.toFixed(2));
  image.style.cursor = next > 1 ? 'zoom-out' : 'zoom-in';
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderDetail(item, editing = false) {
  if (!item) return '';
  const usesContractDetail = item.local && item.moduleId === 'projects';
  const detailFields = item.local && item.moduleId === 'issues'
    ? item.fields.filter(field => ISSUE_CREATE_FIELDS.includes(field.key))
    : item.fields;
  const fields = usesContractDetail ? renderContractDetail(item, editing) : detailFields.map(field => {
    const control = renderFieldControl(field, editing);
    const extraThumbs = editing && (field.key === 'effect' || field.key === 'attachments') ? '' : `<div class="thumbs">${thumbs(field.images, 12)}</div>`;
    return `<div class="field-label">${escapeHtml(field.label)}</div>
      <div class="field-value">${control}${extraThumbs}</div>`;
  }).join('');
  return `<div class="detail-backdrop" data-detail-backdrop>
  <aside class="detail" data-detail-id="${escapeHtml(item.id)}" data-editing="${editing ? '1' : '0'}">
    <button type="button" class="detail-close" data-action="close-detail" aria-label="关闭">×</button>
    <h2 class="detail-title">${escapeHtml(item.title)}</h2>
    <div class="detail-actions">
      ${editing
        ? '<button type="button" class="primary" data-action="save-detail">保存</button><button type="button" data-action="cancel-detail">取消</button>'
        : `<button type="button" class="primary" data-action="edit-detail">编辑</button><button type="button" class="danger" data-action="delete-detail">删除记录</button>`}
    </div>
    ${usesContractDetail ? fields : `<div class="field-grid">${fields}</div>`}
  </aside>
  </div>`;
}

function createProject() {
  const today = new Date().toISOString().slice(0, 10);
  const id = `projects:new:${Date.now()}:${Math.random().toString(16).slice(2)}`;
  additions.projects = additions.projects || [];
  additions.projects.unshift({
    id,
    draft: true,
    values: {
      title: '',
      projectType: '定制',
      status: '未开始',
      priority: 'P0',
      pm: '',
      sales: '',
      createdAt: today,
      children: []
    }
  });
  state.module = 'projects';
  state.status = '';
  state.statusQuick = '';
  state.query = '';
  state.selected = id;
  state.editing = id;
  document.getElementById('searchInput').value = '';
  render();
}

function createIssue() {
  const id = `issues:new:${Date.now()}:${Math.random().toString(16).slice(2)}`;
  additions.issues = additions.issues || [];
  additions.issues.unshift({
    id,
    draft: true,
    values: {
      device: '',
      desc: '',
      owner: '',
      attachments: '',
      source: '',
      status: '待处理'
    }
  });
  state.module = 'issues';
  state.status = '';
  state.statusQuick = '';
  state.query = '';
  state.selected = id;
  state.editing = id;
  document.getElementById('searchInput').value = '';
  render();
}

function removeUnsavedDraft(id = state.editing || state.selected) {
  const record = findRecord(id);
  if (!record || !record.local) return false;
  const item = (additions[record.moduleId] || []).find(entry => entry.id === id);
  if (!item?.draft) return false;
  additions[record.moduleId] = (additions[record.moduleId] || []).filter(entry => entry.id !== id);
  delete edits[id];
  state.selectedIds = state.selectedIds.filter(itemId => itemId !== id);
  return true;
}

function closeDetail(discardDraft = false) {
  if (discardDraft) removeUnsavedDraft();
  state.selected = '';
  state.editing = '';
  render();
}

function deleteRecord(id) {
  const record = findRecord(id);
  if (!record) return;
  if (!confirm(`确定删除记录“${record.title}”？`)) return;
  deleteRecords([id]);
}

function deleteRecords(ids) {
  ids.forEach(id => {
    const record = findRecord(id);
    if (!record) return;
    if (record.local) {
      additions[record.moduleId] = (additions[record.moduleId] || []).filter(item => item.id !== id);
    } else {
      deleted[record.moduleId] = deleted[record.moduleId] || [];
      if (!deleted[record.moduleId].includes(id)) deleted[record.moduleId].push(id);
    }
    delete edits[id];
  });
  state.selected = '';
  state.editing = '';
  state.selectedIds = state.selectedIds.filter(id => !ids.includes(id));
  saveEdits();
  render();
}

function applyStatusToRecords(ids, status) {
  ids.forEach(id => {
    const record = findRecord(id);
    if (!record || !configs[record.moduleId]?.fields.some(([key]) => key === 'status')) return;
    edits[id] = edits[id] || {};
    edits[id].status = status;
  });
  saveEdits();
  render();
}

function batchDeleteSelected() {
  if (!state.selectedIds.length) return;
  if (!confirm(`确定删除选中的 ${state.selectedIds.length} 个项目？`)) return;
  deleteRecords([...state.selectedIds]);
}

function batchApplyStatus() {
  const select = document.getElementById('batchStatusSelect');
  const status = select?.value || '';
  if (!state.selectedIds.length || !status) return;
  applyStatusToRecords([...state.selectedIds], status);
}

function toggleSelected(id, checked) {
  if (checked) {
    if (!state.selectedIds.includes(id)) state.selectedIds.push(id);
  } else {
    state.selectedIds = state.selectedIds.filter(item => item !== id);
  }
  render();
}

function setAllVisibleSelected(checked) {
  const visibleIds = filteredRecords(state.module).map(item => item.id);
  if (checked) {
    state.selectedIds = [...new Set(state.selectedIds.concat(visibleIds))];
  } else {
    state.selectedIds = state.selectedIds.filter(id => !visibleIds.includes(id));
  }
  render();
}

function render() {
  buildRecords();
  renderNav();
  setHeader();
  statusOptions();
  document.getElementById('content').innerHTML = renderList(state.module);
  autoGrowTextareas(document.getElementById('content'));
}

document.getElementById('nav').addEventListener('click', event => {
  const button = event.target.closest('button[data-module]');
  if (!button) return;
  state.module = button.dataset.module;
  state.status = '';
  state.statusQuick = '';
  state.selected = '';
  state.editing = '';
  render();
});

document.getElementById('searchInput').addEventListener('input', event => {
  state.query = event.target.value;
  render();
});

document.getElementById('content').addEventListener('input', event => {
  if (event.target.matches('textarea[data-auto-grow]')) {
    autoGrowTextarea(event.target);
  }
});

document.getElementById('statusSelect').addEventListener('change', event => {
  state.status = event.target.value;
  state.statusQuick = '';
  state.selected = '';
  state.editing = '';
  render();
});

document.getElementById('addProjectBtn').addEventListener('click', () => {
  if (state.module === 'issues') {
    createIssue();
  } else {
    createProject();
  }
});

document.getElementById('content').addEventListener('click', event => {
  if (event.target.closest('[data-select-id]') || event.target.closest('#selectAllVisible')) {
    return;
  }
  const summary = event.target.closest('[data-summary-filter]');
  if (summary) {
    const quick = summary.dataset.summaryFilter;
    state.status = '';
    state.statusQuick = quick === 'all' ? '' : quick;
    state.selected = '';
    state.editing = '';
    document.getElementById('statusSelect').value = '';
    render();
    return;
  }
  if (event.target.matches('[data-detail-backdrop]')) {
    closeDetail(true);
    return;
  }
  const addChild = event.target.closest('[data-child-add]');
  if (addChild) {
    const list = addChild.closest('[data-contract-editor]').querySelector('.child-list');
    list.querySelector('.empty-state')?.remove();
    const index = list.querySelectorAll('.child-card').length;
    list.insertAdjacentHTML('beforeend', renderChildObject(emptyChildObject(), index, true));
    return;
  }
  const removeChild = event.target.closest('[data-child-remove]');
  if (removeChild) {
    const list = removeChild.closest('.child-list');
    removeChild.closest('.child-card').remove();
    if (!list.querySelector('.child-card')) {
      list.innerHTML = '<div class="empty-state">暂无子对象</div>';
    }
    return;
  }
  const addProcess = event.target.closest('[data-process-add]');
  if (addProcess) {
    const processList = addProcess.closest('[data-process-list]');
    const items = processList.querySelector('[data-process-items]');
    const input = processList.querySelector('[data-process-name]');
    const processCount = items.querySelectorAll('.process-card').length;
    const name = input.value.trim() || `自定义工序 ${processCount + 1}`;
    items.querySelector('.empty-state')?.remove();
    items.insertAdjacentHTML('beforeend', renderProcess(emptyProcess(name), processCount, true));
    input.value = '';
    return;
  }
  const removeProcess = event.target.closest('[data-process-remove]');
  if (removeProcess) {
    const items = removeProcess.closest('[data-process-items]');
    removeProcess.closest('.process-card').remove();
    if (!items.querySelector('.process-card')) {
      items.innerHTML = '<div class="empty-state">暂无工序</div>';
    }
    return;
  }
  const removeChildImage = event.target.closest('[data-child-image-remove]');
  if (removeChildImage) {
    const card = removeChildImage.closest('.child-card');
    const images = readJsonInput(card.querySelector('[data-child-images]'));
    images.splice(Number(removeChildImage.dataset.childImageRemove), 1);
    updateChildImages(card, images);
    return;
  }
  const removeChildFile = event.target.closest('[data-child-file-remove]');
  if (removeChildFile) {
    const card = removeChildFile.closest('.child-card');
    const files = readJsonInput(card.querySelector('[data-child-files]'));
    files.splice(Number(removeChildFile.dataset.childFileRemove), 1);
    updateChildFiles(card, files);
    return;
  }
  const previewFileButton = event.target.closest('[data-preview-file-url]');
  if (previewFileButton) {
    previewFile(previewFileButton);
    return;
  }
  const closeFilePreview = event.target.closest('[data-file-preview-close]');
  if (closeFilePreview) {
    closeFilePreview.closest('.file-preview')?.remove();
    return;
  }
  const previewImage = event.target.closest('[data-preview-image]');
  if (previewImage) {
    toggleImagePreview(previewImage);
    return;
  }
  if (event.target.closest('.image-preview')) {
    event.target.closest('.image-preview').remove();
    return;
  }
  const addChoice = event.target.closest('[data-choice-add]');
  if (addChoice) {
    const editor = addChoice.closest('[data-choice-field]');
    const input = editor.querySelector('[data-choice-custom]');
    const value = input.value.trim();
    if (value) {
      updateChoiceEditor(editor, value);
      input.value = '';
    }
    return;
  }
  const removeFile = event.target.closest('[data-file-remove]');
  if (removeFile) {
    const editor = removeFile.closest('[data-file-field]');
    const files = readFileEditor(editor);
    const names = splitPeople(editor.querySelector('[data-file-names]').value);
    const index = Number(removeFile.dataset.fileRemove);
    const removed = files[index];
    files.splice(index, 1);
    updateFileEditor(editor, files, joinPeople(names.filter(name => name !== removed?.name)));
    return;
  }
  const addPerson = event.target.closest('[data-person-add]');
  if (addPerson) {
    const editor = addPerson.closest('[data-person-field]');
    const select = editor.querySelector('[data-person-select]');
    const custom = editor.querySelector('[data-person-custom]');
    const names = splitPeople(editor.querySelector('[data-edit-key]').value);
    const value = select.value || custom.value.trim();
    if (value && !names.includes(value)) {
      updatePersonEditor(editor, names.concat(value));
      custom.value = '';
    }
    return;
  }
  const removePerson = event.target.closest('[data-person-remove]');
  if (removePerson) {
    const editor = removePerson.closest('[data-person-field]');
    const names = splitPeople(editor.querySelector('[data-edit-key]').value);
    updatePersonEditor(editor, names.filter(name => name !== removePerson.dataset.personRemove));
    return;
  }
  const removeImage = event.target.closest('[data-image-remove]');
  if (removeImage) {
    const editor = removeImage.closest('[data-image-field]');
    const images = readImageEditor(editor);
    const names = splitPeople(editor.querySelector('[data-edit-key]').value);
    const index = Number(removeImage.dataset.imageRemove);
    images.splice(index, 1);
    names.splice(index, 1);
    updateImageEditor(editor, images, joinPeople(names));
    return;
  }
  if (event.target.closest('#batchDeleteBtn')) {
    batchDeleteSelected();
    return;
  }
  if (event.target.closest('#batchStatusBtn')) {
    batchApplyStatus();
    return;
  }
  const card = event.target.closest('.record[data-id]');
  if (card) {
    const record = findRecord(card.dataset.id);
    state.selected = card.dataset.id;
    state.editing = '';
    render();
    return;
  }
  const action = event.target.closest('[data-action]')?.dataset.action;
  const detail = event.target.closest('.detail[data-detail-id]');
  if (!action || !detail) return;
  const id = detail.dataset.detailId;
  if (action === 'edit-detail') {
    state.editing = id;
    render();
    return;
  }
  if (action === 'close-detail') {
    closeDetail(true);
    return;
  }
  if (action === 'cancel-detail') {
    if (removeUnsavedDraft(id)) {
      state.selected = '';
    }
    state.editing = '';
    render();
    return;
  }
  if (action === 'delete-detail') {
    deleteRecord(id);
    return;
  }
  if (action === 'save-detail') {
    edits[id] = edits[id] || {};
    detail.querySelectorAll('[data-edit-key]').forEach(input => {
      edits[id][input.dataset.editKey] = input.value;
    });
    detail.querySelectorAll('[data-edit-images-key]').forEach(input => {
      try {
        edits[id][input.dataset.editImagesKey] = JSON.parse(input.value || '[]');
      } catch (error) {
        edits[id][input.dataset.editImagesKey] = [];
      }
    });
    detail.querySelectorAll('[data-edit-files-key]').forEach(input => {
      try {
        edits[id][input.dataset.editFilesKey] = JSON.parse(input.value || '[]');
      } catch (error) {
        edits[id][input.dataset.editFilesKey] = [];
      }
    });
    if (detail.querySelector('[data-contract-editor]')) {
      edits[id].children = collectChildren(detail);
    }
    const savedRecord = findRecord(id);
    const draftItem = savedRecord?.local ? (additions[savedRecord.moduleId] || []).find(item => item.id === id) : null;
    const wasDraft = Boolean(draftItem?.draft);
    if (draftItem) delete draftItem.draft;
    if (!saveEdits()) {
      if (draftItem && wasDraft) draftItem.draft = true;
      return;
    }
    state.editing = '';
    render();
  }
});

document.getElementById('content').addEventListener('wheel', zoomPreviewImage, { passive: false });

document.getElementById('content').addEventListener('paste', async event => {
  const imagePaste = event.target.closest('[data-image-paste]');
  if (imagePaste) {
    const pasted = await pasteImagesIntoEditor(event, imagePaste.closest('[data-image-field]'));
    if (pasted) return;
  }
  const effectField = event.target.closest('.child-effect-field');
  if (!effectField) return;
  const files = [...(event.clipboardData?.items || [])]
    .filter(item => item.type.startsWith('image/'))
    .map(item => item.getAsFile())
    .filter(Boolean);
  if (!files.length) return;
  const card = effectField.closest('.child-card');
  if (!card) return;
  event.preventDefault();
  const uploaded = await Promise.all(files.map(fileToDataUrl));
  updateChildImages(card, readJsonInput(card.querySelector('[data-child-images]')).concat(uploaded));
});

document.getElementById('content').addEventListener('change', async event => {
  const selected = event.target.closest('[data-select-id]');
  if (selected) {
    toggleSelected(selected.dataset.selectId, selected.checked);
    return;
  }
  if (event.target.id === 'selectAllVisible') {
    setAllVisibleSelected(event.target.checked);
    return;
  }
  if (event.target.matches('[data-choice-select]')) {
    const editor = event.target.closest('[data-choice-field]');
    updateChoiceEditor(editor, event.target.value);
    return;
  }
  if (event.target.matches('[data-child-image-upload]')) {
    const card = event.target.closest('.child-card');
    const files = [...event.target.files].filter(file => file.type.startsWith('image/'));
    if (!card || !files.length) return;
    const uploaded = await Promise.all(files.map(fileToDataUrl));
    updateChildImages(card, readJsonInput(card.querySelector('[data-child-images]')).concat(uploaded));
    event.target.value = '';
    return;
  }
  if (event.target.matches('[data-child-file-upload]')) {
    const card = event.target.closest('.child-card');
    const files = [...event.target.files];
    if (!card || !files.length) return;
    const uploaded = await Promise.all(files.map(async file => ({
      name: file.name,
      type: file.type,
      size: file.size,
      dataUrl: await fileToDataUrl(file)
    })));
    updateChildFiles(card, readJsonInput(card.querySelector('[data-child-files]')).concat(uploaded));
    event.target.value = '';
    return;
  }
  if (event.target.matches('[data-image-upload]')) {
    const editor = event.target.closest('[data-image-field]');
    const files = [...event.target.files].filter(file => file.type.startsWith('image/'));
    if (!editor || !files.length) return;
    const uploaded = await Promise.all(files.map(fileToDataUrl));
    const images = readImageEditor(editor).concat(uploaded);
    const names = splitPeople(editor.querySelector('[data-edit-key]').value).concat(files.map(file => file.name));
    updateImageEditor(editor, images, joinPeople(names));
    event.target.value = '';
    return;
  }
  if (event.target.matches('[data-file-upload]')) {
    const editor = event.target.closest('[data-file-field]');
    const files = [...event.target.files];
    if (!editor || !files.length) return;
    const uploaded = await Promise.all(files.map(async file => ({
      name: file.name,
      type: file.type,
      size: file.size,
      dataUrl: await fileToDataUrl(file)
    })));
    const nextFiles = readFileEditor(editor).concat(uploaded);
    const names = splitPeople(editor.querySelector('[data-file-names]').value).concat(files.map(file => file.name));
    updateFileEditor(editor, nextFiles, joinPeople(names));
    event.target.value = '';
  }
});

render();
</script>
</body>
</html>
